<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Event Manager - Student Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Smart Event Manager</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link active" href="index.html">Student Portal</a>
      <a class="nav-link" href="organizer.html">Organizer</a>
    </div>
  </div>
</nav>

<div class="hero">
  <div class="container">
    <h1 class="fw-bold">Discover college events</h1>
    <p class="mb-0 lead">Browse, register, and join the waitlist when an event is full.</p>
  </div>
</div>

<div class="container pb-5">
  <ul class="nav nav-pills mb-3">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tabEvents">Upcoming events</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabMine">My registrations</button></li>
  </ul>

  <div class="tab-content">
    <!-- EVENTS -->
    <div class="tab-pane fade show active" id="tabEvents">
      <div class="row g-2 mb-4">
        <div class="col-md-6"><input id="searchBox" class="form-control" placeholder="Search by event name or venue..."></div>
        <div class="col-md-3">
          <select id="categoryFilter" class="form-select">
            <option value="all">All categories</option>
            <option>Technical</option><option>Cultural</option><option>Sports</option>
            <option>Workshop</option><option>Seminar</option><option>Other</option>
          </select>
        </div>
      </div>
      <div id="eventGrid" class="row g-3"></div>
    </div>

    <!-- MY REGISTRATIONS -->
    <div class="tab-pane fade" id="tabMine">
      <div class="row g-2 mb-3">
        <div class="col-md-6"><input id="myEmail" type="email" class="form-control" placeholder="Enter the email you registered with"></div>
        <div class="col-md-2"><button class="btn btn-primary w-100" onclick="loadMine()">Check status</button></div>
      </div>
      <div id="mineList"></div>
    </div>
  </div>
</div>

<!-- Register modal -->
<div class="modal fade" id="registerModal" tabindex="-1">
  <div class="modal-dialog">
    <form class="modal-content" onsubmit="submitRegistration(event)">
      <div class="modal-header">
        <h5 class="modal-title" id="registerTitle">Register</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p id="registerNote" class="text-muted small"></p>
        <div class="mb-3"><label class="form-label">Full name</label><input id="regName" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Email</label><input id="regEmail" type="email" class="form-control" required></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Close</button>
        <button type="submit" class="btn btn-primary" id="registerBtn">Register</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/app.js"></script>
</body>
</html>
